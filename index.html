<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SKY TRACKER — Live Aircraft Radar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0f0a; font-family: monospace; overflow: hidden; touch-action: none; }
  canvas { display: block; }
  #status {
    position: fixed; top: 15px; left: 15px; color: #5a9a6a; font-size: 12px;
    z-index: 10; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 4px;
    border: 1px solid #2a4a3a;
  }
  #status .count { color: #aaffaa; font-size: 20px; font-weight: bold; }
  #controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 10px;
  }
  button {
    background: #0d1a12; border: 2px solid #3a6a4a; color: #aaffaa;
    padding: 12px 20px; font-family: monospace; font-size: 14px; font-weight: bold;
    border-radius: 6px; cursor: pointer; pointer-events: auto;
  }
  button:active { background: #1a2e1e; border-color: #5aff7a; }
  button:disabled { opacity: 0.4; }
  #infoPanel {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0,20,10,0.9); border: 1px solid #3a6a4a; border-radius: 8px;
    padding: 12px 16px; color: #aaffaa; font-size: 12px; line-height: 1.6;
    display: none; z-index: 10; min-width: 260px;
  }
  #infoPanel .label { color: #5a9a6a; }
  #error {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #ff6644; font-size: 14px; text-align: center; padding: 20px;
    background: rgba(20,0,0,0.8); border-radius: 8px; display: none; z-index: 20;
  }
</style>
</head>
<body>
<canvas id="radar"></canvas>

<div id="status">
  <div class="count" id="aircraftCount">—</div>
  <div id="statusText">Locating you...</div>
</div>

<div id="infoPanel">
  <div><span class="label">Callsign:</span> <span id="iCallsign">—</span></div>
  <div><span class="label">Altitude:</span> <span id="iAlt">—</span></div>
  <div><span class="label">Speed:</span> <span id="iSpeed">—</span></div>
  <div><span class="label">Heading:</span> <span id="iHeading">—</span></div>
  <div><span class="label">Distance:</span> <span id="iDist">—</span></div>
  <div><span class="label">ICAO:</span> <span id="iIcao">—</span></div>
</div>

<div id="controls">
  <button id="refreshBtn" onclick="refreshData()">Refresh</button>
  <button id="reportBtn" onclick="downloadReport()">Download Report</button>
</div>

<div id="error"></div>

<script>
const canvas = document.getElementById('radar');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
let rangeNM = 50;
let aircraft = [];
let userLat = null, userLon = null;
let lastUpdate = null;
let sweepAngle = 0;
let selected = null;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// Get user location
function getUserLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('Geolocation not supported'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        document.getElementById('statusText').textContent = 'Scanning for aircraft...';
        resolve();
      },
      err => reject(new Error('Location denied: ' + err.message)),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

// Fetch from adsb.lol
async function fetchAircraft() {
  if (userLat === null) return;
  const url = `https://api.adsb.lol/v2/lat/${userLat}/lon/${userLon}/dist/${rangeNM}`;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('API error: ' + resp.status);
    const data = await resp.json();
    const list = data.ac || [];
    aircraft = list.filter(a => a.lat !== undefined && a.lon !== undefined).map(a => {
      const dist = haversine(userLat, userLon, a.lat, a.lon);
      const bearing = calculateBearing(userLat, userLon, a.lat, a.lon);
      return {
        hex: a.hex || '—',
        flight: (a.flight || '—').trim(),
        alt: a.alt_baro === 'ground' ? 0 : (a.alt_baro || 0),
        gs: a.gs || 0,
        track: a.track || 0,
        lat: a.lat,
        lon: a.lon,
        distNM: dist,
        bearing: bearing,
        r: a.r || '—',
        t: a.t || '—'
      };
    });
    lastUpdate = new Date();
    document.getElementById('aircraftCount').textContent = aircraft.length;
    document.getElementById('statusText').textContent = 
      `Updated ${lastUpdate.toLocaleTimeString()} · Range ${rangeNM} NM`;
    document.getElementById('error').style.display = 'none';
  } catch (e) {
    showError('Failed to fetch: ' + e.message);
  }
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 3440.065; // Earth radius in NM
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function calculateBearing(lat1, lon1, lat2, lon2) {
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
  const x = Math.cos(lat1*Math.PI/180) * Math.sin(lat2*Math.PI/180) -
            Math.sin(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.cos(dLon);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

async function refreshData() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = 'Fetching...';
  await fetchAircraft();
  btn.disabled = false;
  btn.textContent = 'Refresh';
}

function downloadReport() {
  if (aircraft.length === 0) { showError('No aircraft data to export'); return; }
  const lines = ['Callsign,ICAO,Registration,Type,Altitude(ft),Speed(kt),Heading,Distance(NM),Bearing,Latitude,Longitude,Timestamp'];
  for (const a of aircraft) {
    lines.push([
      a.flight, a.hex, a.r, a.t, a.alt, a.gs, a.track.toFixed(0),
      a.distNM.toFixed(1), a.bearing.toFixed(0),
      a.lat.toFixed(5), a.lon.toFixed(5), lastUpdate.toISOString()
    ].join(','));
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `sky-tracker-report-${Date.now()}.csv`;
  link.click();
  URL.revokeObjectURL(url);
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 5000);
}

// Radar rendering
function drawRadar() {
  ctx.fillStyle = '#0a0f0a';
  ctx.fillRect(0, 0, W, H);

  const maxR = Math.min(W, H) * 0.42;
  const scale = maxR / rangeNM;

  // Range rings
  for (let i = 1; i <= 5; i++) {
    const r = (rangeNM / 5) * i * scale;
    ctx.strokeStyle = 'rgba(40, 80, 50, 0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Cross lines
  ctx.strokeStyle = 'rgba(40, 80, 50, 0.3)';
  ctx.beginPath();
  ctx.moveTo(cx - maxR, cy); ctx.lineTo(cx + maxR, cy);
  ctx.moveTo(cx, cy - maxR); ctx.lineTo(cx, cy + maxR);
  ctx.stroke();

  // Labels
  ctx.fillStyle = '#3a6a4a';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('N', cx, cy - maxR - 10);
  ctx.fillText('S', cx, cy + maxR + 20);
  ctx.fillText('E', cx + maxR + 15, cy + 4);
  ctx.fillText('W', cx - maxR - 15, cy + 4);
  for (let i = 1; i <= 5; i++) {
    const r = (rangeNM / 5) * i * scale;
    ctx.fillText((rangeNM/5*i).toFixed(0) + ' NM', cx + 5, cy - r - 5);
  }

  // Sweep
  sweepAngle += 0.008;
  const grad = ctx.createConicGradient ? null : null;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(sweepAngle);
  const sweepGrad = ctx.createLinearGradient(0, 0, maxR, 0);
  sweepGrad.addColorStop(0, 'rgba(80, 255, 120, 0.4)');
  sweepGrad.addColorStop(1, 'rgba(80, 255, 120, 0)');
  ctx.fillStyle = sweepGrad;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, maxR, 0, 0.4);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Aircraft blips
  for (const a of aircraft) {
    const r = a.distNM * scale;
    if (r > maxR) continue;
    const angle = (a.bearing - 90) * Math.PI / 180;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;

    const isSelected = selected && selected.hex === a.hex;
    const altColor = a.alt > 30000 ? '#ff66ff' :
                     a.alt > 20000 ? '#ffaa33' :
                     a.alt > 10000 ? '#ffff66' : '#66ff66';

    ctx.fillStyle = isSelected ? '#ffffff' : altColor;
    ctx.beginPath();
    ctx.arc(x, y, isSelected ? 6 : 4, 0, Math.PI * 2);
    ctx.fill();

    if (isSelected) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Heading arrow
    if (a.gs > 0) {
      const ha = (a.track - 90) * Math.PI / 180;
      ctx.strokeStyle = altColor;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(ha) * 12, y + Math.sin(ha) * 12);
      ctx.stroke();
    }

    // Callsign label (only if close or selected)
    if (a.distNM < rangeNM * 0.6 || isSelected) {
      ctx.fillStyle = '#aaffaa';
      ctx.font = '10px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(a.flight, x + 8, y - 4);
    }
  }

  // Center dot (you)
  ctx.fillStyle = '#5aff7a';
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(90, 255, 120, 0.5)';
  ctx.beginPath();
  ctx.arc(cx, cy, 10, 0, Math.PI * 2);
  ctx.stroke();
}

// Click/tap to select aircraft
function handleClick(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const my = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  const maxR = Math.min(W, H) * 0.42;
  const scale = maxR / rangeNM;

  let closest = null, closestDist = 25;
  for (const a of aircraft) {
    const r = a.distNM * scale;
    if (r > maxR) continue;
    const angle = (a.bearing - 90) * Math.PI / 180;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    const d = Math.hypot(mx - x, my - y);
    if (d < closestDist) { closestDist = d; closest = a; }
  }

  selected = closest;
  const panel = document.getElementById('infoPanel');
  if (closest) {
    document.getElementById('iCallsign').textContent = closest.flight;
    document.getElementById('iAlt').textContent = closest.alt + ' ft';
    document.getElementById('iSpeed').textContent = closest.gs + ' kt';
    document.getElementById('iHeading').textContent = closest.track.toFixed(0) + '°';
    document.getElementById('iDist').textContent = closest.distNM.toFixed(1) + ' NM';
    document.getElementById('iIcao').textContent = closest.hex;
    panel.style.display = 'block';
  } else {
    panel.style.display = 'none';
  }
}
canvas.addEventListener('click', handleClick);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleClick(e); }, { passive: false });

// Main loop
function loop() {
  drawRadar();
  requestAnimationFrame(loop);
}

// Init
(async function init() {
  try {
    await getUserLocation();
    await fetchAircraft();
    setInterval(fetchAircraft, 8000); // auto-refresh every 8 seconds
    loop();
  } catch (e) {
    showError(e.message);
    document.getElementById('statusText').textContent = 'Error — tap Refresh to retry';
    document.getElementById('refreshBtn').disabled = false;
    loop();
  }
})();
</script>
</body>
</html>
